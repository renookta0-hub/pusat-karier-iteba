<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITEBA Career Center</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ink:#1B1730; --accent:#FF5A5F; --accent2:#6C5CE7;
    --bg:#FFF4E8; --surface:#FFFFFF; --slate:#5B5470;
    --line:#EFE0CE; --success:#2FAE66; --danger:#E64545; --warn:#B8860B; --warnbg:#FFF1DD;
    --paper:#FFFBF3;
    --font-head:'Sora', sans-serif; --font-body:'Inter', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F4F1FA; --accent:#FF7A7E; --accent2:#9C8CFF;
      --bg:#151225; --surface:#1E1A33; --slate:#B3ABC9;
      --line:#332C4D; --paper:#1E1A33; --warnbg:#3A2E12; --warn:#F2C572;
    }
  }
  :root[data-theme="dark"]{
    --ink:#F4F1FA; --accent:#FF7A7E; --accent2:#9C8CFF;
    --bg:#151225; --surface:#1E1A33; --slate:#B3ABC9;
    --line:#332C4D; --paper:#1E1A33; --warnbg:#3A2E12; --warn:#F2C572;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); overflow-x:hidden; }
  img{max-width:100%; display:block;}
  .wrap{max-width:1160px; margin:0 auto; padding:0 24px;}
  .wrap-narrow{max-width:760px; margin:0 auto; padding:0 24px;}
  h1,h2,h3{font-family:var(--font-head); margin:0; letter-spacing:-0.01em;}
  p{margin:0; line-height:1.6;}
  a{color:inherit; text-decoration:none;}
  button{font-family:var(--font-body); cursor:pointer; border:none; background:none; color:inherit;}
  ::placeholder{ color:var(--slate); opacity:.7; }

  /* ---------- buttons / chips ---------- */
  .pill-btn{ display:inline-flex; align-items:center; gap:8px; padding:14px 26px; border-radius:999px; font-weight:700; font-size:15px; }
  .pill-btn.sm{ padding:10px 18px; font-size:13.5px; }
  .btn-primary{ background:var(--ink); color:var(--bg); box-shadow:4px 4px 0 var(--accent); transition:transform .1s; }
  .btn-primary:hover{ transform:translate(1px,1px); box-shadow:3px 3px 0 var(--accent); }
  .btn-outline{ background:transparent; color:var(--ink); border:2px solid var(--ink); }
  .btn-outline:hover{ background:var(--ink); color:var(--bg); }
  .btn-ghost{ background:transparent; color:var(--slate); padding:10px 14px; font-size:13.5px; font-weight:600;}
  .btn-danger{ background:transparent; color:var(--danger); border:1.5px solid var(--danger); padding:9px 16px; border-radius:999px; font-size:13px; font-weight:700;}
  .btn-block{ width:100%; justify-content:center; }
  .chip{ display:inline-block; padding:6px 14px; border-radius:999px; font-size:12.5px; font-weight:700; }
  .icon-btn{ width:34px; height:34px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; }

  /* ---------- nav ---------- */
  .navbar{ position:sticky; top:14px; z-index:60; margin:14px auto 0; max-width:1080px; padding:0 16px; }
  .nav-inner{ display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:2px solid var(--ink); border-radius:26px; padding:10px 12px 10px 18px; box-shadow:4px 4px 0 var(--ink); gap:12px; }
  .logo{ display:flex; align-items:center; gap:10px; font-family:var(--font-head); font-weight:800; font-size:15.5px; flex-shrink:0; }
  .logo-mark{ width:32px; height:32px; border-radius:999px; background:var(--ink); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .logo-mark span{ color:var(--accent); font-family:var(--font-head); font-weight:800; font-size:12px; }
  .nav-links{ display:flex; align-items:center; gap:20px; font-size:13.5px; font-weight:600; color:var(--slate); flex-wrap:wrap; }
  .nav-links a, .nav-links button{ font-size:13.5px; font-weight:600; color:var(--slate); white-space:nowrap; }
  .nav-links a:hover, .nav-links button:hover{ color:var(--ink); }
  .nav-links a.active{ color:var(--ink); }
  .nav-cta{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .nav-user{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; }
  .nav-avatar{ width:28px; height:28px; border-radius:999px; background:var(--accent2); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; }
  .nav-toggle{ display:none; }
  @media(max-width:920px){
    .nav-links{ display:none; }
    .nav-toggle{ display:flex; width:36px; height:36px; align-items:center; justify-content:center; border-radius:999px; background:var(--bg); }
    .nav-mobile{ display:flex; flex-direction:column; gap:2px; background:var(--surface); border:2px solid var(--ink); border-radius:18px; margin-top:8px; padding:10px; box-shadow:4px 4px 0 var(--ink); }
    .nav-mobile a, .nav-mobile button{ display:block; width:100%; text-align:left; padding:12px 14px; border-radius:12px; font-size:14px; font-weight:600; color:var(--ink); }
    .nav-mobile a:hover, .nav-mobile button:hover{ background:var(--bg); }
  }
  @media(min-width:921px){ .nav-mobile{ display:none; } }

  /* ---------- hero ---------- */
  .hero{ padding:64px 0 36px; position:relative; }
  .hero-grid{ display:grid; grid-template-columns:1.05fr .95fr; gap:52px; align-items:center; }
  .eyebrow-sticker{ display:inline-block; background:var(--accent2); color:#fff; padding:7px 16px; border-radius:999px; font-size:13px; font-weight:700; margin-bottom:20px; transform:rotate(-2deg); }
  .hero h1{ font-size:44px; line-height:1.08; font-weight:800; margin-bottom:18px; }
  .hero-sub{ font-size:16px; color:var(--slate); max-width:460px; margin-bottom:28px; }
  .hero-ctas{ display:flex; flex-wrap:wrap; gap:14px; margin-bottom:30px; }
  .hero-stats{ display:flex; gap:28px; flex-wrap:wrap; }
  .hero-stats .num{ font-family:var(--font-head); font-weight:800; font-size:26px; color:var(--ink); }
  .hero-stats .lab{ font-size:12px; color:var(--slate); margin-top:2px; }
  .hero-photo-stack{ position:relative; padding:20px; }
  .hero-photo{ position:relative; border-radius:22px; overflow:hidden; border:3px solid var(--ink); transform:rotate(2.2deg); box-shadow:8px 8px 0 var(--accent2); }
  .hero-photo img{ width:100%; height:320px; object-fit:cover; }
  .sticker-stat{ position:absolute; width:104px; height:104px; border-radius:999px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:#fff; box-shadow:4px 4px 0 var(--ink); border:2px solid var(--ink); }
  .sticker-stat .num{ font-family:var(--font-head); font-weight:800; font-size:22px; }
  .sticker-stat .lab{ font-size:9.5px; margin-top:2px; padding:0 8px; line-height:1.2; }
  .stat-1{ background:var(--accent); top:-16px; left:-20px; transform:rotate(-8deg); }
  .stat-2{ background:var(--ink); bottom:-12px; right:-14px; transform:rotate(7deg); }
  @media(max-width:900px){ .hero-grid{ grid-template-columns:1fr; } .hero h1{ font-size:32px; } .hero-photo-stack{ order:-1; max-width:420px; margin:0 auto; } }

  /* ---------- page banner (internal pages) ---------- */
  .page-banner{ position:relative; margin:0 0 8px; padding:78px 0 68px; background-size:cover; background-position:center; }
  .page-banner::before{ content:""; position:absolute; inset:0; background:linear-gradient(120deg, rgba(27,23,48,.88), rgba(108,92,231,.6)); }
  .page-banner-content{ position:relative; max-width:640px; margin:0 auto; text-align:center; padding:0 24px; }
  .page-banner-content .eyebrow-sticker{ background:var(--accent); }
  .page-banner-content h1{ color:#fff; font-size:34px; margin-bottom:10px; }
  .page-banner-content p{ color:rgba(255,255,255,.85); font-size:15px; }

  /* ---------- sections ---------- */
  section{ padding:56px 0; }
  .section-head{ max-width:560px; margin-bottom:34px; }
  .section-head h2{ font-size:28px; font-weight:800; margin-bottom:10px; }
  .section-head p{ color:var(--slate); font-size:15px; }
  .section-head.center{ margin-left:auto; margin-right:auto; text-align:center; }

  /* ---------- value / overview cards ---------- */
  .value-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
  .value-card{ background:var(--surface); border-radius:20px; padding:26px; border-left:5px solid var(--accent2); }
  .value-card:nth-child(2){ border-left-color:var(--accent); }
  .value-card:nth-child(3){ border-left-color:var(--success); }
  .value-card h3{ font-size:17px; margin-bottom:10px; }
  .value-card p{ font-size:14px; color:var(--slate); margin-bottom:14px; }
  .value-card .vc-link{ font-size:13px; font-weight:700; color:var(--ink); }
  @media(max-width:880px){ .value-grid{ grid-template-columns:1fr; } }

  /* ---------- mood band ---------- */
  .mood-band{ position:relative; margin:0 0 60px; padding:100px 0; background-size:cover; background-position:center; }
  .mood-band::before{ content:""; position:absolute; inset:0; background:linear-gradient(120deg, rgba(27,23,48,.86), rgba(108,92,231,.55)); }
  .mood-band::after{ content:""; position:absolute; left:0; right:0; bottom:-1px; height:40px; background:var(--bg);
    clip-path:polygon(0 100%,3% 30%,7% 100%,11% 40%,15% 100%,19% 25%,23% 100%,27% 45%,31% 100%,35% 20%,39% 100%,43% 40%,47% 100%,51% 30%,55% 100%,59% 45%,63% 100%,67% 25%,71% 100%,75% 40%,79% 100%,83% 30%,87% 100%,91% 45%,95% 100%,100% 20%,100% 100%); }
  .mood-content{ position:relative; max-width:620px; margin:0 auto; text-align:center; padding:0 24px; }
  .mood-content p{ color:#fff; font-family:var(--font-head); font-weight:700; font-size:24px; line-height:1.35; }

  /* ---------- stats band ---------- */
  .stats-band{ background:var(--ink); border-radius:28px; padding:44px 36px; }
  .stats-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:22px; text-align:center; }
  .stats-grid .num{ font-family:var(--font-head); font-weight:800; font-size:32px; color:var(--accent); }
  .stats-grid .lab{ font-size:12.5px; color:#C9C4DB; margin-top:6px; }
  @media(max-width:820px){ .stats-grid{ grid-template-columns:repeat(2,1fr); row-gap:28px; } }

  /* ---------- contact ---------- */
  .contact-grid{ display:grid; grid-template-columns:.9fr 1.1fr; gap:44px; align-items:start; }
  .contact-info-item{ display:flex; gap:14px; margin-bottom:22px; }
  .contact-info-dot{ width:38px; height:38px; border-radius:999px; background:var(--accent2); flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:14px; }
  .contact-info-item h3{ font-size:14.5px; margin-bottom:3px; }
  .contact-info-item p{ font-size:13.5px; color:var(--slate); }
  @media(max-width:880px){ .contact-grid{ grid-template-columns:1fr; } }

  /* ---------- forms ---------- */
  .form-card{ background:var(--surface); border:2px solid var(--ink); border-radius:24px; padding:30px; box-shadow:6px 6px 0 var(--ink); }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12.5px; color:var(--slate); margin-bottom:6px; font-weight:700; }
  .field input, .field select, .field textarea{ width:100%; padding:11px 14px; border:2px solid var(--line); border-radius:14px; font-family:var(--font-body); font-size:14px; background:var(--bg); color:var(--ink); }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--ink); outline:none; }
  .field textarea{ resize:vertical; min-height:80px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media(max-width:600px){ .field-row{ grid-template-columns:1fr; } }
  .role-toggle{ display:flex; gap:10px; margin-bottom:20px; }
  .role-toggle button{ flex:1; padding:14px 10px; border-radius:16px; border:2px solid var(--line); background:var(--bg); font-weight:700; font-size:13px; color:var(--slate); text-align:center; }
  .role-toggle button.active{ border-color:var(--ink); background:var(--ink); color:var(--bg); }
  .form-note{ font-size:12.5px; color:var(--slate); margin-top:14px; text-align:center; }
  .demo-box{ background:var(--paper); border:1.5px dashed var(--line); border-radius:14px; padding:14px 16px; font-size:12.5px; color:var(--slate); margin-top:18px; line-height:1.7; }
  .demo-box b{ color:var(--ink); }

  /* ---------- tabs ---------- */
  .tabbar{ display:flex; gap:8px; margin-bottom:30px; flex-wrap:wrap; }
  .tabbar button{ padding:10px 20px; border-radius:999px; font-size:13.5px; font-weight:700; border:2px solid var(--line); color:var(--slate); background:var(--surface); }
  .tabbar button.active{ border-color:var(--ink); background:var(--ink); color:var(--bg); }

  /* ---------- steps ---------- */
  .steps{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px; margin-bottom:8px; }
  .step-card{ background:var(--surface); border:2px solid var(--ink); border-radius:20px; padding:24px 20px; }
  .step-num{ width:34px; height:34px; border-radius:999px; background:var(--accent); display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-head); font-weight:800; font-size:14px; margin-bottom:14px; }
  .step-card h3{ font-size:15.5px; margin-bottom:8px; }
  .step-card p{ font-size:13.5px; color:var(--slate); }
  @media(max-width:820px){ .steps{ grid-template-columns:1fr; } }

  /* ---------- job / company cards ---------- */
  .search-row{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:24px; }
  .search-row .search-box{ flex:1; min-width:220px; display:flex; align-items:center; gap:8px; border:2px solid var(--line); background:var(--surface); border-radius:14px; padding:0 14px; }
  .search-row .search-box input{ border:none; background:transparent; padding:11px 0; font-size:14px; width:100%; color:var(--ink); }
  .search-row .search-box input:focus{ outline:none; }
  .search-row select{ border:2px solid var(--line); background:var(--surface); border-radius:14px; padding:11px 14px; font-size:14px; color:var(--ink); }
  .cards-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
  @media(max-width:820px){ .cards-grid{ grid-template-columns:1fr; } }
  .job-card{ text-align:left; width:100%; padding:20px; background:var(--surface); border-radius:20px; border:2px solid var(--ink); box-shadow:4px 4px 0 var(--ink); display:flex; flex-direction:column; gap:10px; transition:transform .1s; }
  .job-card:hover{ transform:translate(-1px,-1px); box-shadow:5px 5px 0 var(--ink); }
  .job-card h3{ font-size:16px; line-height:1.35; }
  .job-card .jc-meta{ font-size:12.5px; color:var(--slate); display:flex; flex-wrap:wrap; gap:10px; }
  .company-card{ background:var(--surface); border-radius:20px; padding:22px; border:1.5px solid var(--line); }
  .company-card .cc-dot{ width:40px; height:40px; border-radius:999px; margin-bottom:14px; }
  .company-card h3{ font-size:16px; margin-bottom:4px; }
  .company-card .cc-meta{ font-size:12.5px; color:var(--slate); margin-bottom:10px; }
  .company-card p{ font-size:13.5px; color:var(--slate); }
  .company-card details{ margin-top:8px; }
  .company-card summary{ font-size:12.5px; font-weight:700; color:var(--ink); cursor:pointer; }
  .empty-state{ text-align:center; padding:54px 20px; color:var(--slate); font-size:14px; }

  /* ---------- badges ---------- */
  .badge{ display:inline-flex; align-items:center; padding:5px 12px; border-radius:999px; font-size:11.5px; font-weight:700; }
  .badge-disetujui,.badge-diterima,.badge-verified{ background:color-mix(in srgb, var(--success) 18%, var(--surface)); color:var(--success); }
  .badge-menunggu,.badge-terkirim,.badge-pending{ background:color-mix(in srgb, var(--warn) 18%, var(--surface)); color:var(--warn); }
  .badge-ditolak{ background:color-mix(in srgb, var(--danger) 18%, var(--surface)); color:var(--danger); }
  .badge-ditinjau{ background:color-mix(in srgb, var(--accent2) 18%, var(--surface)); color:var(--accent2); }
  .badge-role{ background:color-mix(in srgb, var(--ink) 12%, var(--surface)); color:var(--ink); }

  /* ---------- dashboard ---------- */
  .banner-warn{ background:var(--warnbg); border:1.5px solid var(--warn); color:var(--warn); padding:14px 18px; border-radius:14px; font-size:13.5px; margin-bottom:22px; }
  .dash-shell{ display:flex; gap:30px; align-items:flex-start; }
  .dash-side{ width:210px; flex-shrink:0; position:sticky; top:100px; }
  .dash-side button{ display:flex; gap:10px; align-items:center; width:100%; text-align:left; padding:11px 14px; border-radius:14px; font-size:13.5px; font-weight:600; color:var(--slate); margin-bottom:4px; }
  .dash-side button.active{ background:var(--ink); color:var(--bg); }
  .dash-main{ flex:1; min-width:0; }
  .dash-main h2{ font-size:22px; margin-bottom:20px; }
  @media(max-width:820px){ .dash-shell{ flex-direction:column; } .dash-side{ width:100%; position:static; display:flex; gap:8px; overflow-x:auto; } .dash-side button{ white-space:nowrap; margin-bottom:0; } }

  .stat-tile-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  @media(max-width:820px){ .stat-tile-grid{ grid-template-columns:repeat(2,1fr); } }
  .stat-tile{ background:var(--surface); border:1.5px solid var(--line); border-top:3px solid var(--accent2); border-radius:16px; padding:18px; }
  .stat-tile .num{ font-family:var(--font-head); font-weight:800; font-size:24px; }
  .stat-tile .lab{ font-size:12px; color:var(--slate); margin-top:4px; }

  .list-row{ background:var(--surface); border:1.5px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:12px; display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap; align-items:center; }
  .list-row .lr-title{ font-size:14.5px; font-weight:700; }
  .list-row .lr-sub{ font-size:12.5px; color:var(--slate); margin-top:3px; }
  .list-row .lr-actions{ display:flex; align-items:center; gap:8px; }
  .list-row .lr-actions button{ padding:7px; border-radius:10px; }
  .list-row .lr-actions button:hover{ background:var(--bg); }
  .app-status-select{ border:2px solid var(--line); background:var(--surface); border-radius:12px; padding:9px 12px; font-size:13px; color:var(--ink); font-family:var(--font-body); }

  /* ---------- modal ---------- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(27,23,48,.55); display:flex; align-items:flex-start; justify-content:center; padding:56px 16px; overflow:auto; z-index:200; }
  .modal-card{ background:var(--surface); border-radius:24px; max-width:640px; width:100%; padding:30px; border:2px solid var(--ink); box-shadow:8px 8px 0 var(--ink); position:relative; }
  .modal-close{ position:absolute; top:16px; right:16px; width:32px; height:32px; border-radius:999px; background:var(--bg); display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; }
  .job-detail-meta{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin:18px 0 20px; font-size:13.5px; }
  .job-detail-meta .l{ font-size:11.5px; color:var(--slate); margin-bottom:3px; }
  .job-detail-block{ margin-bottom:16px; }
  .job-detail-block h4{ font-size:13px; margin-bottom:6px; }
  .job-detail-block p{ font-size:13.5px; color:var(--slate); line-height:1.65; }
  .apply-ok{ display:flex; align-items:center; gap:8px; font-size:13.5px; padding:12px 16px; border-radius:12px; background:color-mix(in srgb, var(--success) 16%, var(--surface)); color:var(--success); font-weight:600; }
  .apply-guest{ font-size:13.5px; padding:12px 16px; border-radius:12px; background:var(--bg); border:1.5px solid var(--line); color:var(--slate); }

  /* ---------- toast ---------- */
  .toast{ background:var(--ink); color:var(--bg); padding:13px 20px; border-radius:14px; font-size:13.5px; box-shadow:4px 4px 0 var(--accent); max-width:320px; }

  /* ---------- cta band ---------- */
  .cta-band{ background:var(--accent2); border-radius:28px; padding:58px 36px; text-align:center; position:relative; overflow:hidden; }
  .cta-band::before{ content:""; position:absolute; width:200px; height:200px; border-radius:999px; background:rgba(255,255,255,.12); top:-70px; right:-50px; }
  .cta-band h2{ color:#fff; font-size:27px; max-width:540px; margin:0 auto 12px; position:relative; }
  .cta-band p{ color:rgba(255,255,255,.85); font-size:14px; margin-bottom:24px; position:relative; }
  .cta-band .pill-btn{ position:relative; background:#fff; color:var(--ink); box-shadow:4px 4px 0 var(--ink); }

  /* ---------- footer ---------- */
  footer{ padding:46px 0 36px; border-top:1.5px solid var(--line); margin-top:20px; }
  .foot-grid{ display:grid; grid-template-columns:1.4fr repeat(3,1fr); gap:30px; margin-bottom:32px; }
  .foot-brand p{ font-size:13px; color:var(--slate); margin-top:10px; max-width:220px; }
  .foot-col h4{ font-size:12.5px; margin-bottom:13px; font-weight:700; }
  .foot-col a, .foot-col button{ display:block; font-size:13px; color:var(--slate); margin-bottom:9px; text-align:left; }
  .foot-col a:hover, .foot-col button:hover{ color:var(--ink); }
  .foot-bottom{ font-size:12px; color:var(--slate); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  @media(max-width:820px){ .foot-grid{ grid-template-columns:1fr 1fr; } }

<script>
/* =====================================================================

   falls back to an in-memory store (per-session only) otherwise.
===================================================================== */

var JOB_TYPES = ["Magang", "Penuh Waktu", "Paruh Waktu", "Kontrak"];

/* ---------------------------- utilities ---------------------------- */

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c];
  });
}
function uid(prefix){ return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function fmtDate(d){
  if (!d) return "-";
  try { return new Date(d).toLocaleDateString("id-ID", { day:"numeric", month:"short", year:"numeric" }); }
  catch(e){ return d; }
}
function nowISO(){ return new Date().toISOString(); }

var toastTimer = null;
function notify(msg){
  var host = document.getElementById("toastHost");
  if (!host) return;
  host.innerHTML = '<div class="toast">' + esc(msg) + "</div>";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ host.innerHTML = ""; }, 3200);
}

function getSessionUserId(){
  try { return localStorage.getItem("pk_session_uid") || null; } catch(e){ return null; }
}
function setSessionUserId(id){
  try { if (id) localStorage.setItem("pk_session_uid", id); else localStorage.removeItem("pk_session_uid"); } catch(e){}
}

/* ------------------------------- state ------------------------------ */

  route: "",
  sub: null,
  sub2: null,
  data: { users: [], jobs: [], applications: [], messages: [] },
  mobileMenuOpen: false,
  mitraTab: "lowongan",
  admissionTab: "mahasiswa",
  authTab: "login",
  authRole: "mahasiswa",
  jobQuery: "",
  jobTipe: "Semua",
  openJobId: null,
  dashTab: {},           // per-role remembered tab
  editingJobId: null,
  creatingJob: false,
  showDemoHints: false
};

var usingDb = false;
var LOCAL = { users: [], jobs: [], applications: [], messages: [] };
var dataReady = false;

function getCurrentUser(){
  if (!state.sessionUserId) return null;

}

  return { users: users, jobs: jobs, applications: applications, messages: [] };
}

function seedLocal(){
  var s = seedObjects();
  LOCAL.users = s.users; LOCAL.jobs = s.jobs; LOCAL.applications = s.applications; LOCAL.messages = s.messages;
  state.data = { users: LOCAL.users.slice(), jobs: LOCAL.jobs.slice(), applications: LOCAL.applications.slice(), messages: LOCAL.messages.slice() };
}

function ensureDbSeed(){
  return db.doc("meta/seed").get().then(function(snap){
    if (snap.exists) return;
    return db.doc("meta/seed").acquire({ holder: "seed-" + uid(""), ttlMs: 8000 }).then(function(lease){
      if (!lease.acquired) return;
      return db.doc("meta/seed").get().then(function(check){
        if (check.exists) return;
        var s = seedObjects();
        var writes = [];
        s.users.forEach(function(u){ writes.push(db.doc("users/" + u.id).set(u)); });
        s.jobs.forEach(function(j){ writes.push(db.doc("jobs/" + j.id).set(j)); });
        s.applications.forEach(function(a){ writes.push(db.doc("applications/" + a.id).set(a)); });
        return Promise.all(writes).then(function(){
          return db.doc("meta/seed").set({ seeded: true, at: nowISO() });
        });
      });
    });
  }).catch(function(){ /* seeding is best-effort */ });
}

function subscribeAll(){
  function bind(col, key){
    db.collection(col).onSnapshot(function(snap){
      var arr = [];
      snap.docs.forEach(function(d){ if (d.exists) arr.push(d.data()); });
      state.data[key] = arr;
      dataReady = true;
      render();
    }, function(err){
      notify("Koneksi data terputus (" + err.code + "). Memuat ulang mungkin membantu.");
    });
  }
  bind("users", "users");
  bind("jobs", "jobs");
  bind("applications", "applications");
  bind("messages", "messages");
}

/* ------------------------------ data layer ---------------------------- */

function dataAddUser(obj){
  obj.createdAt = nowISO();
  if (usingDb){
    var ref = db.collection("users").doc();
    var data = Object.assign({}, obj, { id: ref.id });
    return ref.set(data).then(function(){ return data; });
  }
  var data2 = Object.assign({}, obj, { id: uid("u") });
  LOCAL.users.push(data2); state.data.users = LOCAL.users.slice(); render();
  return Promise.resolve(data2);
}
function dataUpdateUser(id, patch){
  if (usingDb) return db.doc("users/" + id).update(patch);
  var u = LOCAL.users.find(function(x){ return x.id === id; });
  if (u) Object.assign(u, patch);
  state.data.users = LOCAL.users.slice(); render();
  return Promise.resolve();
}
function dataDeleteUser(id){
  if (usingDb) return db.doc("users/" + id).delete();
  LOCAL.users = LOCAL.users.filter(function(x){ return x.id !== id; });
  state.data.users = LOCAL.users.slice(); render();
  return Promise.resolve();
}
function dataAddJob(obj){
  if (usingDb){
    var ref = db.collection("jobs").doc();
    var data = Object.assign({}, obj, { id: ref.id });
    return ref.set(data).then(function(){ return data; });
  }
  var data2 = Object.assign({}, obj, { id: uid("j") });

  return Promise.resolve(data2);
}
function dataUpdateJob(id, patch){
  if (usingDb) return db.doc("jobs/" + id).update(patch);
  var j = LOCAL.jobs.find(function(x){ return x.id === id; });
  if (j) Object.assign(j, patch);
  state.data.jobs = LOCAL.jobs.slice(); render();
  return Promise.resolve();
}
function dataDeleteJob(id){

function dataAddApplication(obj){

    var ref = db.collection("applications").doc();

}
function dataUpdateApplication(id, patch){

function dataAddMessage(obj){

/* -------------------------------- auth -------------------------------- */

function doLogin(email, password){
  var e = (email || "").trim().toLowerCase();
  var found = state.data.users.find(function(u){ return u.email.toLowerCase() === e && u.password === password; });
  if (!found){ notify("Email atau kata sandi salah."); return; }
  state.sessionUserId = found.id; setSessionUserId(found.id);
  notify("Berhasil masuk sebagai " + found.name + ".");
  navigate("#/dashboard");
}

function doRegister(role, fields){
  if (!fields.name || !fields.email || !fields.password){ notify("Lengkapi data wajib."); return; }
  var emailLower = fields.email.trim().toLowerCase();
  if (state.data.users.some(function(u){ return u.email.toLowerCase() === emailLower; })){
    notify("Email sudah terdaftar."); return;
  }
  var obj = { role: role, name: fields.name.trim(), email: fields.email.trim(), password: fields.password };
  if (role === "mahasiswa"){
    Object.assign(obj, { nim: fields.nim || "", prodi: fields.prodi || "", angkatan: fields.angkatan || "", noHp: fields.noHp || "" });
  }
  if (role === "mitra"){
    Object.assign(obj, { industri: fields.industri || "", lokasi: fields.lokasi || "", deskripsi: fields.deskripsi || "", verified: false });
  }
  dataAddUser(obj).then(function(created){
    state.sessionUserId = created.id; setSessionUserId(created.id);
    if (role === "mitra"){
      notify("Akun mitra dibuat. Menunggu verifikasi admin.");
      navigate("#/dashboard");
    } else {
      notify("Akun berhasil dibuat. Selamat mencari lowongan!");
      navigate("#/mitra");
    }
  });
}

function doLogout(){
  state.sessionUserId = null; setSessionUserId(null);
  notify("Berhasil keluar.");
  navigate("#/");
}

function parseHash(){
  var h = location.hash || "#/";
  h = h.replace(/^#\/?/, "");
  var parts = h.split("/").filter(function(p){ return p.length > 0; });
  return parts;
}
function navigate(hash){
  if (location.hash === hash) render();
  else location.hash = hash;
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}

function getApprovedJobs(){
  return state.data.jobs.filter(function(j){ return j.status === "disetujui"; });
}
function filteredJobs(){
  var q = state.jobQuery.trim().toLowerCase();
  var tipe = state.jobTipe;
  return getApprovedJobs().filter(function(j){
    var mitra = state.data.users.find(function(u){ return u.id === j.mitraId; });
    var hay = (j.title + " " + j.lokasi + " " + (mitra ? mitra.name : "")).toLowerCase();
    var matchesQ = !q || hay.indexOf(q) !== -1;
    var matchesTipe = tipe === "Semua" || j.tipe === tipe;
    return matchesQ && matchesTipe;
  });
}

function renderJobsListInto(containerId){
  var el = document.getElementById(containerId);
  if (!el) return;
  var jobs = filteredJobs();
  if (jobs.length === 0){
    el.innerHTML = '<div class="empty-state">Tidak ada lowongan yang cocok dengan pencarian ini.</div>';
    return;
  }
  el.innerHTML = '<div class="cards-grid">' + jobs.map(function(j){
    var mitra = state.data.users.find(function(u){ return u.id === j.mitraId; });
    return jobCardHtml(j, mitra);
  }).join("") + '</div>';
}

function hashStr(s){
  var h = 0;
  for (var i = 0; i < s.length; i++){ h = ((h << 5) - h) + s.charCodeAt(i); h |= 0; }
  return h;
}

          return ''
            + '<div class="list-row">'
            + '<div><div class="lr-title">' + esc(u.name) + ' <span class="badge badge-role">' + esc(u.role) + '</span>' + (u.role === "mitra" ? (u.verified ? ' <span class="badge badge-verified">Terverifikasi</span>' : ' <span class="badge badge-pending">Menunggu</span>') : "") + '</div><div class="lr-sub">' + esc(u.email) + '</div></div>'
            + '<div class="lr-actions"><button class="btn-danger" data-action="delete-user:' + u.id + '" type="button">Hapus</button></div>'
            + '</div>';
        }).join(""));
  } else if (tab === "pesan"){
    var msgs = state.data.messages.slice().reverse();
    main = '<h2>Pesan Masuk</h2>' + (msgs.length === 0
      ? '<div class="empty-state">Belum ada pesan masuk dari formulir kontak.</div>'
      : msgs.map(function(msg){
          return ''
            + '<div class="list-row" style="align-items:flex-start;">'
            + '<div><div class="lr-title">' + esc(msg.name) + ' &middot; ' + esc(msg.email) + '</div><div class="lr-sub" style="margin-top:6px; max-width:520px;">' + esc(msg.message) + '</div><div class="lr-sub" style="margin-top:6px;">' + fmtDate(msg.createdAt) + '</div></div>'
            + '</div>';
        }).join(""));
  }

  return '<div class="dash-shell"><div class="dash-side">' + sideHtml + '</div><div class="dash-main">' + main + '</div></div>';
}

function dashMitra(user){
  var tab = state.dashTab.mitra || "lowongan";
  var side = [["lowongan", "Lowongan Saya"], ["pelamar", "Pelamar"], ["profil", "Profil"]];
  var sideHtml = side.map(function(s){
    return '<button data-action="set-dash-tab:mitra:' + s[0] + '" class="' + (tab === s[0] ? "active" : "") + '" type="button">' + s[1] + '</button>';
  }).join("");

  var warnBanner = !user.verified ? '<div class="banner-warn">Akun perusahaan Anda sedang menunggu verifikasi admin. Lowongan tetap bisa dibuat, namun baru tayang setelah akun dan lowongan disetujui.</div>' : "";

  var main = "";
  if (tab === "lowongan"){
    var myJobs = state.data.jobs.filter(function(j){ return j.mitraId === user.id; });
    if (state.creatingJob){
      main = '<h2>Lowongan Baru</h2>' + jobFormHtml(user.id, null);
    } else if (state.editingJobId){
      var editJob = myJobs.find(function(j){ return j.id === state.editingJobId; });
      main = '<h2>Edit Lowongan</h2>' + jobFormHtml(user.id, editJob);
    } else {
      main = '<h2>Lowongan Saya</h2>'
        + '<button class="pill-btn btn-primary" style="margin-bottom:20px;" data-action="start-create-job" type="button">+ Pasang Lowongan Baru</button>'
        + (myJobs.length === 0 ? '<div class="empty-state">Belum ada lowongan. Mulai dengan memasang lowongan pertama Anda.</div>'
          : myJobs.map(function(j){
              return ''
                + '<div class="list-row">'
                + '<div><div class="lr-title">' + esc(j.title) + ' <span class="badge badge-' + esc(j.status) + '">' + esc(j.status) + '</span></div><div class="lr-sub">' + esc(j.tipe) + ' &middot; ' + esc(j.lokasi) + ' &middot; batas ' + fmtDate(j.deadline) + '</div></div>'
                + '<div class="lr-actions">'
                + '<button class="pill-btn sm btn-outline" data-action="start-edit-job:' + j.id + '" type="button">Edit</button>'
                + '<button class="btn-danger" data-action="delete-job:' + j.id + '" type="button">Hapus</button>'
                + '</div></div>';
            }).join(""));
    }
  } else if (tab === "pelamar"){
    var myJobIds = state.data.jobs.filter(function(j){ return j.mitraId === user.id; }).map(function(j){ return j.id; });
    var apps = state.data.applications.filter(function(a){ return myJobIds.indexOf(a.jobId) !== -1; });
    main = '<h2>Pelamar</h2>' + (apps.length === 0 ? '<div class="empty-state">Belum ada pelamar untuk lowongan Anda.</div>'
      : apps.map(function(a){
          var job = state.data.jobs.find(function(j){ return j.id === a.jobId; });
          var student = state.data.users.find(function(u){ return u.id === a.studentId; });
          return ''
            + '<div class="list-row" style="align-items:flex-start;">'
            + '<div><div class="lr-title">' + esc(student ? student.name : "-") + ' &rarr; ' + esc(job ? job.title : "-") + '</div>'
            + '<div class="lr-sub">' + esc(student ? student.prodi + " · Angkatan " + student.angkatan : "") + '</div>'
            + (a.cvUrl ? '<div class="lr-sub">CV: ' + esc(a.cvUrl) + '</div>' : "")
            + (a.pesan ? '<div class="lr-sub" style="margin-top:4px;">"' + esc(a.pesan) + '"</div>' : "")
            + '</div>'
            + '<div>'
            + '<select data-action="update-app-status:' + a.id + '" class="app-status-select">'
            + ["terkirim", "ditinjau", "diterima", "ditolak"].map(function(st){ return '<option value="' + st + '"' + (a.status === st ? " selected" : "") + '>' + st + '</option>'; }).join("")
            + '</select>'
            + '</div></div>';
        }).join(""));
  } else if (tab === "profil"){
    main = ''
      + '<h2>Profil Perusahaan</h2>'
      + '<div class="form-card" style="max-width:480px;">'
      + '<div class="field"><label>Nama Perusahaan</label><input type="text" value="' + esc(user.name) + '" disabled></div>'
      + '<div class="field"><label>Email</label><input type="text" value="' + esc(user.email) + '" disabled></div>'
      + '<div class="field"><label>Industri</label><input type="text" value="' + esc(user.industri || "-") + '" disabled></div>'
      + '<div class="field"><label>Lokasi</label><input type="text" value="' + esc(user.lokasi || "-") + '" disabled></div>'
      + '<div class="field"><label>Status</label><div>' + (user.verified ? '<span class="badge badge-verified">Terverifikasi</span>' : '<span class="badge badge-pending">Menunggu Verifikasi</span>') + '</div></div>'
      + '</div>';
  }

  return '<div class="dash-shell"><div class="dash-side">' + sideHtml + '</div><div class="dash-main">' + warnBanner + main + '</div></div>';
}

function dashMahasiswa(user){
  var tab = state.dashTab.mahasiswa || "cari";
  var side = [["cari", "Cari Lowongan"], ["lamaran", "Lamaran Saya"], ["profil", "Profil"]];
  var sideHtml = side.map(function(s){
    return '<button data-action="set-dash-tab:mahasiswa:' + s[0] + '" class="' + (tab === s[0] ? "active" : "") + '" type="button">' + s[1] + '</button>';
  }).join("");

  var main = "";
  if (tab === "cari"){
    main = ''
      + '<h2>Cari Lowongan</h2>'
      + '<div class="search-row">'
      + '<div class="search-box"><input type="text" id="jobSearchInput" placeholder="Cari posisi, lokasi, atau nama perusahaan..." value="' + esc(state.jobQuery) + '"></div>'
      + '<select id="jobTipeSelect">'
      + '<option value="Semua"' + (state.jobTipe === "Semua" ? " selected" : "") + '>Semua Tipe</option>'
      + JOB_TYPES.map(function(t){ return '<option value="' + t + '"' + (state.jobTipe === t ? " selected" : "") + '>' + t + '</option>'; }).join("")
      + '</select>'
      + '</div>'
      + '<div id="jobsResults"></div>';
  } else if (tab === "lamaran"){
    var apps = state.data.applications.filter(function(a){ return a.studentId === user.id; });
    main = '<h2>Lamaran Saya</h2>' + (apps.length === 0 ? '<div class="empty-state">Anda belum mengirim lamaran. Jelajahi lowongan yang tersedia.</div>'
      : apps.map(function(a){
          var job = state.data.jobs.find(function(j){ return j.id === a.jobId; });
          var m = job ? state.data.users.find(function(u){ return u.id === job.mitraId; }) : null;
          return ''
            + '<div class="list-row">'
            + '<div><div class="lr-title">' + esc(job ? job.title : "Lowongan telah dihapus") + '</div><div class="lr-sub">' + esc(m ? m.name : "-") + ' &middot; dikirim ' + fmtDate(a.dikirim) + '</div></div>'
            + '<span class="badge badge-' + esc(a.status) + '">' + esc(a.status) + '</span>'
            + '</div>';
        }).join(""));
  } else if (tab === "profil"){
    main = ''
      + '<h2>Profil</h2>'
      + '<div class="form-card" style="max-width:480px;">'
      + '<div class="field"><label>Nama</label><input type="text" value="' + esc(user.name) + '" disabled></div>'
      + '<div class="field"><label>Email</label><input type="text" value="' + esc(user.email) + '" disabled></div>'
      + '<div class="field-row">'
      + '<div class="field"><label>NIM</label><input type="text" value="' + esc(user.nim || "-") + '" disabled></div>'
      + '<div class="field"><label>Program Studi</label><input type="text" value="' + esc(user.prodi || "-") + '" disabled></div>'
      + '</div>'
      + '<div class="field"><label>Angkatan</label><input type="text" value="' + esc(user.angkatan || "-") + '" disabled></div>'
      + '</div>';
  }

  return '<div class="dash-shell"><div class="dash-side">' + sideHtml + '</div><div class="dash-main">' + main + '</div></div>';
}

function pageDashboard(){
  var user = getCurrentUser();
  if (!user){
    return '<section class="wrap-narrow" style="padding-top:70px;"><div class="empty-state">Anda perlu masuk untuk melihat dasbor ini.</div>'
      + '<div style="text-align:center;"><button class="pill-btn btn-primary" data-action="goto-login" type="button">Masuk Sekarang</button></div></section>';
  }
  var body;
  if (user.role === "admin") body = dashAdmin();
  else if (user.role === "mitra") body = dashMitra(user);
  else body = dashMahasiswa(user);

  return ''
    + '<section class="wrap" style="padding-top:44px;">'
    + '<div class="section-head"><h2>Halo, ' + esc(user.name.split(" ")[0]) + '</h2><p>' + (user.role === "admin" ? "Kelola verifikasi mitra, moderasi lowongan, dan pengguna platform." : user.role === "mitra" ? "Kelola lowongan dan pelamar Anda." : "Cari lowongan dan lacak lamaran Anda.") + '</p></div>'
    + body
    + '</section>';
}

/* ---------------------------- render / afterRender ------------------------ */

function render(){
  var parts = parseHash();
  state.route = parts[0] || "";
  state.sub = parts[1] || null;
  state.sub2 = parts[2] || null;

  if (state.route === "admission" && (state.sub === "mahasiswa" || state.sub === "mitra")) state.admissionTab = state.sub;
  if (state.route === "login" && state.sub === "register"){
    state.authTab = "register";
    if (state.sub2 === "mahasiswa" || state.sub2 === "mitra") state.authRole = state.sub2;
  }

  var html = "";
  switch (state.route){
    case "": html = pageLanding(); break;
    case "about": html = pageAbout(); break;
    case "mitra": html = pageMitra(); break;
    case "admission": html = pageAdmission(); break;
    case "login": html = pageLogin(); break;
    case "dashboard": html = pageDashboard(); break;
    default: html = pageLanding();
  }

  var root = document.getElementById("app");
  root.innerHTML = navbarHtml() + html + footerHtml() + jobDetailModalHtml();
  afterRender();
  updateDbFlag();
}

function afterRender(){
  if (document.getElementById("jobsResults")){
    renderJobsListInto("jobsResults");
    wireJobFilterInputs();
  }
}

function wireJobFilterInputs(){
  var input = document.getElementById("jobSearchInput");
  var select = document.getElementById("jobTipeSelect");
  if (input){
    input.addEventListener("input", function(e){
      state.jobQuery = e.target.value;
      renderJobsListInto("jobsResults");
    });
  }
  if (select){
    select.addEventListener("change", function(e){
      state.jobTipe = e.target.value;
      renderJobsListInto("jobsResults");
    });
  }
}

function updateDbFlag(){
  var flag = document.getElementById("dbFlag");
  if (!flag) return;
  flag.style.display = "block";
  flag.textContent = usingDb ? "Data langsung aktif" : "Mode pratinjau lokal — data tidak tersimpan permanen";
}

/* ------------------------------- nav helpers ------------------------------ */

function handleApplyJobsNav(){
  state.mobileMenuOpen = false;
  var user = getCurrentUser();
  if (user && user.role === "mahasiswa") navigate("#/mitra");
  else { state.admissionTab = "mahasiswa"; navigate("#/admission/mahasiswa"); }
}
function handleApplyMitraNav(){
  state.mobileMenuOpen = false;
  var user = getCurrentUser();
  if (user && user.role === "mitra") navigate("#/dashboard");
  else { state.admissionTab = "mitra"; navigate("#/admission/mitra"); }
}

/* -------------------------------- actions --------------------------------- */

function handleAction(action){
  if (!action) return;
  var parts = action.split(":");
  var name = parts[0];
  switch (name){
    case "toggle-mobile-menu": state.mobileMenuOpen = !state.mobileMenuOpen; render(); break;
    case "logout": doLogout(); break;
    case "goto-login": state.mobileMenuOpen = false; state.authTab = "login"; navigate("#/login"); break;
    case "nav-apply-jobs": handleApplyJobsNav(); break;
    case "nav-apply-mitra": handleApplyMitraNav(); break;
    case "open-job": state.openJobId = parts[1]; render(); break;
    case "close-modal": state.openJobId = null; render(); break;
    case "set-mitra-tab": state.mitraTab = parts[1]; render(); break;
    case "set-admission-tab": state.admissionTab = parts[1]; render(); break;
    case "set-auth-tab": state.authTab = parts[1]; render(); break;
    case "set-auth-role": state.authRole = parts[1]; render(); break;
    case "set-dash-tab":
      var role = parts[1], t = parts[2];
      state.dashTab[role] = t;
      state.creatingJob = false; state.editingJobId = null;
      render();
      break;
    case "start-create-job": state.creatingJob = true; state.editingJobId = null; render(); break;
    case "start-edit-job": state.editingJobId = parts[1]; state.creatingJob = false; render(); break;
    case "cancel-job-form": state.creatingJob = false; state.editingJobId = null; render(); break;
    case "delete-job": dataDeleteJob(parts[1]).then(function(){ notify("Lowongan dihapus."); }); break;
    case "delete-user": dataDeleteUser(parts[1]).then(function(){ notify("Pengguna dihapus."); }); break;
    case "verify-mitra": dataUpdateUser(parts[1], { verified: true }).then(function(){ notify("Mitra berhasil diverifikasi."); }); break;
    case "job-status": dataUpdateJob(parts[1], { status: parts[2] }).then(function(){ notify("Status lowongan diperbarui."); }); break;
    default: break;
  }
}

/* ---------------------------- global event wiring --------------------------- */

document.addEventListener("click", function(e){
  if (e.target && e.target.id === "jobModalOverlay"){
    state.openJobId = null; render(); return;
  }
  var navEl = e.target.closest("[data-nav]");
  if (navEl){
    e.preventDefault();
    state.mobileMenuOpen = false;
    navigate(navEl.getAttribute("data-nav"));
    return;
  }
  var actEl = e.target.closest("[data-action]");
  if (actEl && actEl.tagName !== "SELECT"){
    e.preventDefault();
    handleAction(actEl.getAttribute("data-action"));
  }
});

document.addEventListener("change", function(e){
  var sel = e.target.closest('[data-action^="update-app-status:"]');
  if (sel){
    var id = sel.getAttribute("data-action").split(":")[1];
    dataUpdateApplication(id, { status: sel.value }).then(function(){ notify("Status lamaran diperbarui."); });
  }
});

document.addEventListener("submit", function(e){
  var form = e.target.closest("[data-form]");
  if (!form) return;
  e.preventDefault();
  var type = form.getAttribute("data-form");
  var fd = new FormData(form);
  var fields = {};
  fd.forEach(function(v, k){ fields[k] = v; });

  if (type === "contact"){
    if (!fields.name || !fields.email || !fields.message){ notify("Lengkapi semua kolom."); return; }
    dataAddMessage({ name: fields.name.trim(), email: fields.email.trim(), message: fields.message.trim() }).then(function(){
      notify("Pesan terkirim, kami akan segera menghubungi Anda.");
      form.reset();
    });
  } else if (type === "login"){
    doLogin(fields.email, fields.password);
  } else if (type === "register"){
    doRegister(form.getAttribute("data-role"), fields);
  } else if (type === "apply"){
    var jobId = form.getAttribute("data-jobid");
    var user = getCurrentUser();
    if (!user || user.role !== "mahasiswa"){ notify("Masuk sebagai mahasiswa untuk melamar."); return; }
    var already = state.data.applications.some(function(a){ return a.jobId === jobId && a.studentId === user.id; });
    if (already){ notify("Anda sudah melamar posisi ini."); return; }
    dataAddApplication({
      jobId: jobId, studentId: user.id, pesan: (fields.pesan || "").trim(),
      cvUrl: (fields.cvUrl || "").trim(), status: "terkirim", dikirim: nowISO()
    }).then(function(){ notify("Lamaran terkirim."); render(); });
  } else if (type === "job"){
    var mitraId = form.getAttribute("data-mitraid");
    var editId = form.getAttribute("data-editid");
    if (!fields.title || !fields.lokasi || !fields.deadline){ notify("Lengkapi kolom wajib."); return; }
    var obj = {
      mitraId: mitraId, title: fields.title.trim(), tipe: fields.tipe, lokasi: fields.lokasi.trim(),
      kuota: Number(fields.kuota) || 1, gaji: (fields.gaji || "").trim(), deadline: fields.deadline,
      deskripsi: (fields.deskripsi || "").trim(), kualifikasi: (fields.kualifikasi || "").trim()
    };
    if (editId){
      dataUpdateJob(editId, obj).then(function(){ notify("Lowongan diperbarui."); state.editingJobId = null; render(); });
    } else {
      obj.status = "menunggu"; obj.dibuat = nowISO();
      dataAddJob(obj).then(function(){ notify("Lowongan dikirim, menunggu moderasi admin."); state.creatingJob = false; render(); });
    }
  }
});

/* ---------------------------------- boot ------------------------------------ */

function boot(){
  seedLocal();
  render();
  if (window.claude && typeof window.claude.use === "function"){
    window.claude.use("db").then(function(resolved){
      if (resolved){
        db = resolved; usingDb = true;
        return ensureDbSeed().then(function(){ subscribeAll(); });
      } else {
        usingDb = false; updateDbFlag();
      }
    }).catch(function(){ usingDb = false; updateDbFlag(); });
  } else {
    usingDb = false; updateDbFlag();
  }
  window.addEventListener("hashchange", render);
}

boot();

</script>
</body>
</html>
